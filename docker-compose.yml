name: rab-mess

services:
  postgres:
    image: postgres:16-alpine
    container_name: srb_database
    restart: unless-stopped
    environment:
      POSTGRES_USER: mess
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mess}
      POSTGRES_DB: rab_mess
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mess -d rab_mess"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: srb_redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command:
      - /bin/sh
      - -c
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
        else
          exec redis-server --appendonly yes
        fi
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'if [ -n "$$REDIS_PASSWORD" ]; then redis-cli -a "$$REDIS_PASSWORD" ping; else redis-cli ping; fi',
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: srb_backend
    restart: unless-stopped
    environment:
      POSTGRES_USER: mess
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mess}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: rab_mess
      DATABASE_URL: postgresql+psycopg://mess:${POSTGRES_PASSWORD:-mess}@postgres:5432/rab_mess
      REDIS_URL: redis://redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_CACHE_TTL: ${REDIS_CACHE_TTL:-120}
      JWT_SECRET: ${JWT_SECRET:-local-dev-cc-jwt-secret-change-me}
      APP_SECRET: ${APP_SECRET:-${JWT_SECRET:-local-dev-cc-jwt-secret-change-me}}
      JWT_EXPIRES_SECONDS: ${JWT_EXPIRES_SECONDS:-7200}
      JWT_REFRESH_EXPIRES_SECONDS: ${JWT_REFRESH_EXPIRES_SECONDS:-7200}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001}
      SEED_STAFF_PASSWORD: ${SEED_STAFF_PASSWORD:-ChangeMe!}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_LOCAL_PATH: /var/lib/rab-mess/files
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      ZK_ENABLED: ${ZK_ENABLED:-true}
      ZK_HOST: ${ZK_HOST:-192.168.9.111}
      ZK_PORT: ${ZK_PORT:-4370}
      ZK_TIMEOUT: ${ZK_TIMEOUT:-10}
      ZK_PASSWORD: ${ZK_PASSWORD:-0}
      ZK_FORCE_UDP: ${ZK_FORCE_UDP:-false}
    ports:
      - "${API_PORT:-8000}:8000"
      - "8088:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 60s
    volumes:
      - files_data:/var/lib/rab-mess/files

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: srb_worker
    restart: unless-stopped
    command: ["python", "worker.py"]
    environment:
      POSTGRES_USER: mess
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mess}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: rab_mess
      REDIS_URL: redis://redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-local-dev-cc-jwt-secret-change-me}
      APP_SECRET: ${APP_SECRET:-${JWT_SECRET:-local-dev-cc-jwt-secret-change-me}}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - files_data:/var/lib/rab-mess/files

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_USE_API: ${NEXT_PUBLIC_USE_API:-true}
        NEXT_PUBLIC_ZK_DEMO: ${NEXT_PUBLIC_ZK_DEMO:-false}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
        API_PROXY_URL: http://api:8000
        GIT_SHA: ${GIT_SHA:-dev}
    container_name: srb_frontend
    restart: unless-stopped
    environment:
      API_PROXY_URL: http://api:8000
    ports:
      # Default 3010 so a bare `docker compose up` cannot steal host :3000 (often WMS).
      - "${WEB_PORT:-3010}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres_data:
  redis_data:
  files_data:
