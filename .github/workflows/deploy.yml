name: Deploy Frontend

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGE_HOST }}
          username: ${{ secrets.STAGE_USER }}
          key: ${{ secrets.STAGE_KEY }}
          script: |
            set -e

            FRONTEND_DIR=/var/www/mess/frontend
            PROJECT_DIR=/var/www/mess

            echo "========================================"
            echo "Starting frontend deployment"
            echo "========================================"

            cd "$FRONTEND_DIR"

            echo "Fetching latest develop branch..."
            git fetch origin develop

            echo "Switching to develop branch..."
            git checkout develop

            echo "Synchronizing repository with origin/develop..."
            git reset --hard origin/develop

            echo "Verifying Git status..."
            git status

            echo "Verifying required files..."
            test -f package.json
            test -f package-lock.json
            test -f Dockerfile

            echo "Required frontend files found."

            cd "$PROJECT_DIR"

            echo "Validating Docker Compose..."
            docker compose config

            echo "Building Docker image..."
            docker compose build

            echo "Starting containers..."
            docker compose up -d

            echo "Checking container status..."
            docker compose ps

            echo "========================================"
            echo "Deployment completed successfully."
            echo "========================================"
