services:
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ms-apptriangle-web
    restart: unless-stopped
    ports:
      - "3000:8080"

  web-dev:
    profiles:
      - dev
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: ms-apptriangle-web-dev
    ports:
      - "3000:8080"
    volumes:
      - ./frontend:/app
      - web_dev_node_modules:/app/node_modules
    environment:
      WATCHPACK_POLLING: "true"

volumes:
  web_dev_node_modules:
