worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 32m;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy same-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

  server {
    listen 80;
    server_name _;

    location /health {
      proxy_pass http://api:8000/health;
      proxy_set_header Host $host;
      proxy_set_header X-Request-ID $request_id;
    }

    location /health/live {
      proxy_pass http://api:8000/health/live;
      proxy_set_header Host $host;
    }

    location /health/ready {
      proxy_pass http://api:8000/health/ready;
      proxy_set_header Host $host;
    }

    location /api/ {
      client_max_body_size 32m;
      proxy_pass http://api:8000/api/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
    }

    location / {
      proxy_pass http://web:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # Terminate TLS here only after real certificates are mounted.
  # See docs/TLS.md. Do not enable HSTS until HTTPS is verified.
  #
  # server {
  #   listen 443 ssl;
  #   server_name app.example.com;
  #   ssl_certificate     /etc/nginx/certs/fullchain.pem;
  #   ssl_certificate_key /etc/nginx/certs/privkey.pem;
  #   # add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
  #   ... same locations as above, X-Forwarded-Proto https ...
  # }
}
