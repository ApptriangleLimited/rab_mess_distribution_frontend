name: rab-mess

services:
  postgres:
    image: postgres:16-alpine
    container_name: rab-mess-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mess
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mess}
      POSTGRES_DB: rab_mess
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mess -d rab_mess"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: rab-mess-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rab-mess-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://mess:${POSTGRES_PASSWORD:-mess}@postgres:5432/rab_mess
      REDIS_URL: redis://redis:6379/0
      REDIS_CACHE_TTL: ${REDIS_CACHE_TTL:-120}
      JWT_SECRET: ${JWT_SECRET:-local-dev-cc-jwt-secret-change-me}
      JWT_EXPIRES_SECONDS: ${JWT_EXPIRES_SECONDS:-604800}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001}
      SEED_STAFF_PASSWORD: ${SEED_STAFF_PASSWORD:-ChangeMe!}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_USE_API: ${NEXT_PUBLIC_USE_API:-false}
        NEXT_PUBLIC_ZK_DEMO: ${NEXT_PUBLIC_ZK_DEMO:-false}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        API_PROXY_URL: http://api:8000
    container_name: rab-mess-web
    restart: unless-stopped
    environment:
      API_PROXY_URL: http://api:8000
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres_data:
  redis_data:
